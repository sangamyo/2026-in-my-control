# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: https://render.com/deploy?repo=https://github.com/sangamyo/2026-in-my-control
# Render has no MongoDB, so create a free MongoDB Atlas cluster and paste its
# connection string when Render asks for MONGO_URI.
services:
  - type: web
    name: hok-goal-tracker-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://2026-in-my-control.vercel.app
